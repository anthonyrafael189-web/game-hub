<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap">
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#0a1330}
@property --b{syntax:'<color>';inherits:true;initial-value:#1d3a8a}
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--a:#0a1330;--b:#1d3a8a;--ink:#f4f6ff;--mut:#9fb0dc}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:'Sora',system-ui,'Segoe UI',sans-serif;color:var(--ink);overflow:hidden;
 background:radial-gradient(120% 90% at 70% 10%,var(--b),var(--a) 70%);transition:--a .7s,--b .7s;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 6vw;font-size:15px;color:var(--mut)}
.pad{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#59607a}
.on .dot{background:#5dffb0;box-shadow:0 0 10px #5dffb0}
main{flex:1;display:flex;align-items:center;position:relative;min-height:0}
#track{display:flex;gap:28px;padding:0;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform;position:relative;left:50%;width:max-content}
.tile{flex:none;width:210px;height:290px;border-radius:22px;position:relative;overflow:hidden;cursor:pointer;
 background:linear-gradient(160deg,var(--c1),var(--c2));background-size:cover;background-position:center;
 opacity:.5;transform:scale(.9);transition:transform .3s,opacity .3s,box-shadow .3s;outline:none}
.tile.sel{opacity:1;transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 24px 60px rgba(0,0,0,.55),0 0 80px color-mix(in srgb,var(--c1) 60%,transparent)}
.tile span{position:absolute;left:18px;right:18px;bottom:18px;font-weight:600;font-size:22px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.tile:not(.add):not(.sel){background-blend-mode:normal}.tile.no-cover{background-image:radial-gradient(circle at 70% 20%,rgba(255,255,255,.25),transparent 50%),linear-gradient(145deg,var(--c1),var(--c2))!important}.tile span{z-index:1}.tile.add{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:64px;font-weight:300}
.tile.add span{font-size:16px;font-weight:400}
footer{padding:0 6vw 34px;min-height:190px}
h1{margin:0 0 8px;font-weight:600;font-size:clamp(28px,4vw,46px)}
#desc{margin:0;max-width:60ch;color:var(--mut);font-weight:300;line-height:1.6;font-size:16px}
.hints{margin-top:26px;display:flex;gap:26px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.hints b{color:var(--ink);font-weight:600;margin-right:6px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(255,255,255,.14);backdrop-filter:blur(14px);padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:600px){.tile{width:160px;height:230px}.tile span{font-size:18px}footer{min-height:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div id="clock"></div><div class="pad" id="pad"><i class="dot"></i><span id="padtxt">Aperte um botão do controle</span></div></header>
<main><div id="track" role="listbox" aria-label="Jogos"></div></main>
<footer>
  <h1 id="title"></h1>
  <p id="desc"></p>
  <div class="hints"><span><b>✕</b>Jogar</span><span><b>◀ ▶</b>Navegar</span><span><b>△</b>Remover jogo adicionado</span><span><b>L1 R1</b>Pular 5 jogos</span><span>Teclado: setas, Enter, Delete</span></div>
</footer>
<div id="toast"></div>

var custom=[];
try{custom=JSON.parse(localStorage.getItem('hub-games')||'[]')}catch(e){}
function save(){try{localStorage.setItem('hub-games',JSON.stringify(custom))}catch(e){}}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function all(){return GAMES.concat(custom.map(function(g){var h=hue(g.title);return{title:g.title,url:g.url,desc:'Jogo adicionado por você.',c1:'hsl('+h+',80%,55%)',c2:'hsl('+((h+60)%360)+',70%,22%)',custom:true}}))}
var list=[],idx=0;
var track=document.getElementById('track'),tEl=document.getElementById('title'),dEl=document.getElementById('desc');
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2600)}
function render(){
  list=all();track.innerHTML='';
  list.concat([{add:true}]).forEach(function(g,i){
    var d=document.createElement('div');d.className='tile'+(g.add?' add':'');d.setAttribute('role','option');
    if(g.add){d.innerHTML='+<span>Adicionar jogo</span>'}
    else{d.style.setProperty('--c1',g.c1);d.style.setProperty('--c2',g.c2);if(g.cover)d.style.backgroundImage='url("'+g.cover+'")';d.innerHTML='<span></span>';d.firstChild.textContent=g.title;if(g.cover){var coverImg=new Image();coverImg.onload=function(){d.style.backgroundImage='linear-gradient(to top,rgba(0,0,0,.65),transparent 65%),url(\"'+g.cover+'\")'};coverImg.onerror=function(){d.classList.add('no-cover')};coverImg.src=g.cover}}
    d.onclick=function(){if(i===idx)act();else{idx=i;update()}};
    track.appendChild(d);
  });
  update(true);
}
function update(instant){
  var tiles=track.children;idx=Math.max(0,Math.min(idx,tiles.length-1));
  for(var i=0;i<tiles.length;i++)tiles[i].classList.toggle('sel',i===idx);
  var t=tiles[idx];
  // O track começa no centro da tela; alinhar pelo centro real da capa.
  var center=t.offsetLeft+t.offsetWidth/2;
  if(instant)track.style.transition='none';
  track.style.transform='translate3d('+(-center)+'px,0,0)';
  if(instant)requestAnimationFrame(function(){requestAnimationFrame(function(){track.style.transition=''})});
  var g=list[idx];
  if(g){tEl.textContent=g.title;dEl.textContent=g.desc;var r=document.documentElement.style;r.setProperty('--a',shade(g.c2));r.setProperty('--b',g.c1)}
  else{tEl.textContent='Adicionar jogo';dEl.textContent='Cole o nome e o link de um jogo para ele aparecer aqui.'}
}
function shade(c){return 'color-mix(in srgb,'+c+' 55%,#050810)'}
function act(){
  var g=list[idx];
  if(!g){
    var n=prompt('Nome do jogo:');if(!n)return;
    var u=prompt('Link do jogo (começando com https://):');if(!u)return;
    custom.push({title:n.trim(),url:u.trim()});save();render();idx=list.length-1;update();return;
  }
  if(/^https?:\/\//i.test(g.url)){var fr=true;try{fr=window.top!==window}catch(e){}if(fr){var w=window.open(g.url,'_blank','noopener');if(!w)toast('Permita pop-ups para abrir o jogo.')}else location.href=g.url}else toast('Defina o link deste jogo na lista GAMES do código.');
}
function remove(){
  var g=list[idx];if(!g)return;
  if(!g.custom){toast('Só dá para remover jogos adicionados pela tela.');return}
  if(!confirm('Remover "'+g.title+'"?'))return;
  custom.splice(idx-GAMES.length,1);save();idx=Math.max(0,idx-1);render();
}
function move(d){idx+=d;update()}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='Enter')act();else if(e.key==='Delete')remove();else if(e.key==='PageDown')move(5);else if(e.key==='PageUp')move(-5);else if(e.key==='Home'){idx=0;update()}else if(e.key==='End'){idx=999;update()}
});

var padOn=false,held=0,lastMove=0,aDown=false,tDown=false,rDown=false,lDown=false;
function setPad(on,name){padOn=on;document.getElementById('pad').classList.toggle('on',on);document.getElementById('padtxt').textContent=on?'Controle conectado':'Aperte um botão do controle'}

addEventListener('gamepaddisconnected',function(){setPad(false)});
function poll(){
  var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
  for(var i=0;i<pads.length;i++)if(pads[i]){gp=pads[i];break}
  if(gp){
    if(!padOn)setPad(true);
    var b=function(n){return gp.buttons[n]&&gp.buttons[n].pressed},x=gp.axes[0]||0;
